<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workers API Lab</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1f2933;
            --muted: #637381;
            --paper: #f7f4ed;
            --panel: #fffdf8;
            --line: #ded8ca;
            --accent: #d3543c;
            --accent-dark: #9d3829;
            --blue: #256b72;
            font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: radial-gradient(circle at 90% 0%, #f4d8bd 0 18%, transparent 42%), var(--paper);
        }
        header, main { width: min(1080px, calc(100% - 40px)); margin: auto; }
        header { padding: 52px 0 34px; }
        .eyebrow { color: var(--accent-dark); font-size: .78rem; font-weight: 700; letter-spacing: .16em; }
        h1 { max-width: 640px; margin: 12px 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 7vw, 5.6rem); line-height: .96; font-weight: 500; }
        .intro { max-width: 590px; color: var(--muted); font-size: 1.05rem; line-height: 1.8; }
        .workspace { display: grid; grid-template-columns: 1.25fr .75fr; gap: 20px; padding-bottom: 60px; }
        .panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); padding: 26px; box-shadow: 8px 8px 0 rgba(31, 41, 51, .06); }
        h2 { margin: 0 0 20px; font-size: 1.1rem; }
        label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .83rem; font-weight: 700; }
        input { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); font: inherit; }
        .endpoint-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
        button { min-height: 76px; padding: 12px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); cursor: pointer; text-align: left; font: inherit; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
        button:hover { transform: translateY(-2px); border-color: var(--accent); background: #fff7f0; }
        button strong { display: block; color: var(--blue); font-size: 1rem; }
        button span { display: block; margin-top: 5px; color: var(--muted); font-size: .75rem; }
        .result { min-height: 286px; overflow: auto; background: #202a2e; color: #e8f0df; padding: 20px; font: .88rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; }
        .status { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: .82rem; }
        .status strong { color: var(--accent-dark); }
        .notes { margin: 0; padding-left: 1.2rem; color: var(--muted); line-height: 1.9; }
        @media (max-width: 760px) {
            header, main { width: min(100% - 24px, 560px); }
            header { padding-top: 32px; }
            .workspace { grid-template-columns: 1fr; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>
<header>
    <div class="eyebrow">CLOUDFLARE PAGES × WORKERS</div>
    <h1>動くWebを、<br>小さく試す。</h1>
    <p class="intro">Pagesの画面からWorkers APIへリクエストを送り、返ってきたJSONを確認できます。まずはベースURLを設定して、好きなエンドポイントを選んでください。</p>
</header>
<main class="workspace">
    <section class="panel">
        <h2>APIを呼び出す</h2>
        <label for="worker-url">WorkerベースURL</label>
        <input id="worker-url" type="url" value="http://127.0.0.1:8787" placeholder="https://worker-name.account.workers.dev">
        <div class="endpoint-grid">
            <button type="button" data-path="/api"><strong>API status</strong><span>接続状態を確認</span></button>
            <button type="button" data-path="/api/course"><strong>Course</strong><span>学科紹介を取得</span></button>
            <button type="button" data-path="/api/hello?name=山田"><strong>Hello</strong><span>名前付きで挨拶</span></button>
            <button type="button" data-path="/api/fortune"><strong>Fortune</strong><span>今日の運勢を取得</span></button>
            <button type="button" data-path="/api/events"><strong>Events</strong><span>イベント一覧を取得</span></button>
        </div>
    </section>
    <section class="panel">
        <div class="status"><span>RESPONSE</span><strong id="status">待機中</strong></div>
        <pre id="result" class="result">ボタンを押すと、WorkerからのJSONを表示します。</pre>
        <ul class="notes">
            <li>ローカル: <code>npm run dev</code></li>
            <li>本番: WorkerのURLに置き換えてください</li>
        </ul>
    </section>
</main>
<script>
    const urlInput = document.querySelector("#worker-url");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");

    async function requestApi(path) {
        const baseUrl = urlInput.value.trim().replace(/\/$/, "");
        if (!baseUrl) {
            status.textContent = "URLを入力してください";
            return;
        }
        status.textContent = "通信中...";
        result.textContent = "";
        try {
            const response = await fetch(`${baseUrl}${path}`);
            const body = await response.json();
            status.textContent = `${response.status} ${response.ok ? "OK" : "ERROR"}`;
            result.textContent = JSON.stringify(body, null, 2);
        } catch (error) {
            status.textContent = "通信エラー";
            result.textContent = "Workerに接続できませんでした。URLとCORS設定を確認してください。";
        }
    }

    document.querySelectorAll("button[data-path]").forEach((button) => {
        button.addEventListener("click", () => requestApi(button.dataset.path));
    });
</script>
</body>
</html>
